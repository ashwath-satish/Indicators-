<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Indicators−</title>
<meta name="description" content="A searchable reference for DECA performance indicators." />
<link rel="icon" href="favicon.ico" />
<link rel="manifest" href="site.webmanifest" />
<meta name="theme-color" content="#fbfaf8" />
<link rel="preload" href="fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/ibm-plex-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">Indicators<span class="brand-mark">−</span></a>
    <form class="topbar-search" id="topbar-search-form" role="search">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="m19.6 21-6.3-6.3q-.75.6-1.725.95Q10.6 16 9.5 16q-2.725 0-4.612-1.887Q3 12.225 3 9.5q0-2.725 1.888-4.613Q6.775 3 9.5 3t4.613 1.887Q16 6.775 16 9.5q0 1.1-.35 2.075-.35.975-.95 1.725l6.3 6.3ZM9.5 14q1.875 0 3.188-1.312Q14 11.375 14 9.5q0-1.875-1.312-3.188Q11.375 5 9.5 5 7.625 5 6.312 6.312 5 7.625 5 9.5q0 1.875 1.312 3.188Q7.625 14 9.5 14Z"/></svg>
      <input id="topbar-search-input" type="search" placeholder="Search indicators or codes" autocomplete="off" aria-label="Search indicators" />
    </form>
    <nav class="topbar-nav">
      <a href="#/areas">Areas</a>
      <a href="#/about">About</a>
    </nav>
  </header>

  <main id="app" class="app"></main>

  <footer class="site-footer">
    <p>Indicators− — a study reference for DECA performance indicators.</p>
    <p class="footer-by">Made by Ashwath Satish</p>
  </footer>

  <script id="tpl-home" type="text/x-template">
    <section class="hero">
      <h1>Study from <span id="hero-total">2,200+</span> performance indicators</h1>
      <p class="hero-sub">Search every indicator by name, code, or topic — or browse by career cluster and instructional area.</p>
      <form class="hero-search" id="hero-search-form">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m19.6 21-6.3-6.3q-.75.6-1.725.95Q10.6 16 9.5 16q-2.725 0-4.612-1.887Q3 12.225 3 9.5q0-2.725 1.888-4.613Q6.775 3 9.5 3t4.613 1.887Q16 6.775 16 9.5q0 1.1-.35 2.075-.35.975-.95 1.725l6.3 6.3ZM9.5 14q1.875 0 3.188-1.312Q14 11.375 14 9.5q0-1.875-1.312-3.188Q11.375 5 9.5 5 7.625 5 6.312 6.312 5 7.625 5 9.5q0 1.875 1.312 3.188Q7.625 14 9.5 14Z"/></svg>
        <input id="hero-search-input" type="search" placeholder="Search indicators" autocomplete="off" aria-label="Search indicators" />
      </form>
    </section>

    <section class="section">
      <h2 class="section-title">Career clusters</h2>
      <div class="category-grid" id="category-grid"></div>
    </section>

    <section class="section">
      <div class="section-header-row">
        <h2 class="section-title">Instructional areas</h2>
        <a class="link-muted" href="#/areas">View all</a>
      </div>
      <div class="area-grid" id="area-grid-preview"></div>
    </section>
  </script>

  <script id="tpl-category" type="text/x-template">
    <div class="page-header" data-cat></div>
    <div class="area-chip-row" id="cat-area-chips"></div>
    <div class="indicator-list" id="cat-indicator-list"></div>
  </script>

  <script id="tpl-areas" type="text/x-template">
    <div class="page-header">
      <h1>Instructional areas</h1>
      <p class="page-sub">Browse indicators by instructional area.</p>
    </div>
    <div class="area-grid area-grid-full" id="area-grid-full"></div>
  </script>

  <script id="tpl-area" type="text/x-template">
    <div class="page-header" data-area></div>
    <div class="indicator-list" id="area-indicator-list"></div>
  </script>

  <script id="tpl-search" type="text/x-template">
    <div class="page-header">
      <h1 id="search-heading">Search</h1>
      <p class="page-sub" id="search-count"></p>
    </div>
    <div class="indicator-list" id="search-indicator-list"></div>
  </script>

  <script id="tpl-about" type="text/x-template">
    <div class="page-header">
      <h1>About</h1>
      <p class="page-sub">What this is, who made it, and what it covers.</p>
    </div>
    <div class="about-body">
      <p>Indicators− is a searchable reference for the performance indicators used in DECA
      competitive events. Every indicator is listed with its code, instructional area, and a
      plain-language explanation, so you can look something up mid-practice without digging
      through a PDF.</p>

      <p>It is a single static site — no accounts, no tracking, and no server needed. It runs
      just as well from a local folder as it does on the web.</p>

      <section class="about-block">
        <h2 class="section-title">Credits</h2>
        <p class="credit-line">Made by Ashwath Satish</p>
        <p class="credit-note">Indicator explanations are sourced from indicators-plus.vercel.app,
        pending a rewrite.</p>
        <p class="credit-note">Performance indicators are published by DECA Inc. This is an
        unofficial study aid and is not affiliated with or endorsed by DECA.</p>
      </section>

      <section class="about-block">
        <h2 class="section-title">Coverage</h2>
        <p id="about-stats"></p>
      </section>
    </div>
  </script>

  <script id="tpl-indicator-row" type="text/x-template">
    <a class="indicator-row" href="#">
      <span class="indicator-code"></span>
      <span class="indicator-main">
        <span class="indicator-title"></span>
        <span class="indicator-excerpt"></span>
      </span>
      <span class="indicator-area-tag"></span>
    </a>
  </script>

  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" id="indicator-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
